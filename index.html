<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>실타래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- [좌상단] 동기화 상태 + 로그아웃 -->
<div id="syncStatus"><span id="syncDot"></span><span id="syncText">연결 중…</span><button id="btnLogout">로그아웃</button></div>
<!-- [우상단] 검색창 + 연결하기 버튼 -->
<div id="topRight">
  <div id="searchWrap"><input id="searchInput" type="text" placeholder="기록 검색…"></div>
  <div id="toolbar"><button class="tbtn" id="btnConnect" title="카드 두 개를 눌러 연결/해제">🔗 연결하기</button></div>
</div>

<!-- [캔버스] 선(svg) / 카드 층(world) / 접점 태그 층(tagWorld) -->
<div id="viewport">
  <svg id="lines"></svg>
  <div id="world"></div>
  <div id="tagWorld"></div>
</div>


<!-- [사진 확대 보기] -->
<div id="lightbox"><div class="lb-close" id="lbClose">×</div><div id="lbContent"></div></div>
<!-- [하단 알림] -->
<div id="toast"></div>
<datalist id="sourceList"></datalist>

<!-- [로그인 화면] -->
<div id="loginScreen">
  <div class="login-box">
    <h1>메모</h1>
    <p>내 구글 계정으로 로그인해주세요.</p>
    <button id="btnGoogle">Google로 로그인</button>
    <div id="loginMsg"></div>
  </div>
</div>

<script type="module">
  /* =========================================================
     Firebase 설정 — 아래 값을 본인 Firebase 프로젝트의 값으로 교체하세요.
     (Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정 및 구성)
  ========================================================= */
  /* 설정값은 firebase-config.js 파일에 따로 넣어요 (index.html을 고쳐도 설정이 안 날아가요) */
  let firebaseConfig;
  try{ ({ firebaseConfig } = await import('./firebase-config.js')); }catch(e){ firebaseConfig = {apiKey:"YOUR_API_KEY"}; }

  if(!firebaseConfig || firebaseConfig.apiKey === "YOUR_API_KEY"){
    document.body.innerHTML = `
      <div id="setupWarning"><div class="box">
        <h1>Firebase 설정이 필요해요</h1>
        <p><code>firebase-config.js</code> 파일의 값을 본인의 Firebase 프로젝트 값으로 바꿔주세요. 파일이 index.html과 같은 폴더에 있는지도 확인해주세요.</p>
      </div></div>`;
    throw new Error("Firebase config not set");
  }

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, enableIndexedDbPersistence, serverTimestamp, writeBatch } =
    await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
  const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } =
    await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
  const { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } =
    await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js");

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);
  try{ await enableIndexedDbPersistence(db); }catch(e){ /* 여러 탭 등: 무시 */ }

  const cardsCol = collection(db, 'cards');
  const linksCol = collection(db, 'links');

  (function(){
  "use strict";

  const uid = ()=> 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

  /* ---------- 확인/알림 팝업 ---------- */
  function showConfirm(message, {okText='삭제', okClass='confirm-ok'}={}){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML = `<div class="confirm-box"><p></p><div class="confirm-actions">
        <button class="confirm-cancel">취소</button><button class="${okClass}">${okText}</button></div></div>`;
      overlay.querySelector('p').textContent = message;
      document.body.appendChild(overlay);
      const cleanup = (v)=>{ overlay.remove(); resolve(v); };
      overlay.querySelector('.confirm-cancel').onclick = ()=> cleanup(false);
      overlay.querySelector('.'+okClass.split(' ')[0]).onclick = ()=> cleanup(true);
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(false); });
    });
  }
  function showAlert(message){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML = `<div class="confirm-box"><p></p><div class="confirm-actions"><button class="confirm-ok neutral">확인</button></div></div>`;
      overlay.querySelector('p').textContent = message;
      document.body.appendChild(overlay);
      overlay.querySelector('button').onclick = ()=>{ overlay.remove(); resolve(); };
    });
  }

  /* ---------- 상태 ---------- */
  let cards = new Map();  // id -> {id,x,y,date,html}
  let links = new Map();  // id -> {id,from,to}
  let panX = 0, panY = 0, zoom = 1;
  let connectMode = false, connectFrom = null, ready = false;

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const tagWorld = document.getElementById('tagWorld');
  const svg = document.getElementById('lines');
  const toast = document.getElementById('toast');
  const syncDot = document.getElementById('syncDot');
  const syncText = document.getElementById('syncText');

  function setSyncStatus(state){
    syncDot.className = state;
    syncText.textContent = state==='ok' ? '동기화됨' : state==='off' ? '오프라인' : '연결 중…';
  }
  window.addEventListener('online', ()=> setSyncStatus('ok'));
  window.addEventListener('offline', ()=> setSyncStatus('off'));

  function showToast(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 1600);
  }

  /* 화면 위치/배율은 기기마다 따로 저장 (동기화 X) */
  function loadLocalView(){
    try{ const v = JSON.parse(localStorage.getItem('thread-journal-view')); if(v){ panX=v.panX||0; panY=v.panY||0; zoom=v.zoom||1; } }catch(e){}
  }
  function saveLocalView(){ try{ localStorage.setItem('thread-journal-view', JSON.stringify({panX,panY,zoom})); }catch(e){} }

  function applyTransform(){
    world.style.transform = tagWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    requestAnimationFrame(updateLines);
  }

  function plainText(html){ const d=document.createElement('div'); d.innerHTML=html||''; return d.textContent||''; }

  /* 카드 HTML 안에 들어 있는 Storage 경로들 */
  function mediaPathsIn(html){
    const d = document.createElement('div'); d.innerHTML = html||'';
    return Array.from(d.querySelectorAll('.embed[data-path]')).map(n=>n.dataset.path);
  }

  /* ---------- 출처 도우미 ---------- */
  const normSource = (s)=> (s||'').trim().replace(/\s+/g,' ').toLowerCase();
  function sourceColor(s){
    const key = normSource(s); let h = 0;
    for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360} 52% 68%)`;
  }
  let focusSource = null; // 지금 강조 중인 출처 (없으면 null)
  let focusCard = null;   // 카드 상단을 더블클릭해서 강조 중인 카드 (없으면 null)
  function linkedSet(){
    const s = new Set();
    if(!focusCard) return s;
    s.add(focusCard);
    links.forEach(l=>{ if(l.from===focusCard) s.add(l.to); if(l.to===focusCard) s.add(l.from); });
    return s;
  }
  function applyHighlights(){
    if(focusCard && !cards.has(focusCard)) focusCard = null;
    const linked = linkedSet();
    document.querySelectorAll('.card').forEach(el=>{
      const c = cards.get(el.id); if(!c) return;
      const dimBySrc = !!focusSource && normSource(c.source) !== focusSource;
      const dimByLink = !!focusCard && !linked.has(el.id);
      el.classList.toggle('src-dim', dimBySrc || dimByLink);
    });
    updateLines();
  }
  function clearCardFocus(){ if(focusCard){ focusCard = null; applyHighlights(); } }
  function refreshSourceList(){
    const seen = new Map();
    cards.forEach(c=>{ const k = normSource(c.source); if(k && !seen.has(k)) seen.set(k, c.source.trim()); });
    document.getElementById('sourceList').innerHTML =
      Array.from(seen.values()).map(v=> `<option value="${v.replace(/"/g,'&quot;')}">`).join('');
  }
  function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, 26) + 'px'; }

  /* ---------- 카드 렌더 ---------- */
  function renderCard(card){
    let el = document.getElementById(card.id);
    if(!el){
      el = document.createElement('div');
      el.className = 'card';
      el.id = card.id;
      el.innerHTML = `
        <div class="src-band" title="클릭: 같은 출처의 카드만 강조 (다시 누르면 해제)"></div>
        <div class="card-head">
          <span class="drag-dots">⠿</span>
          <button class="card-quote-btn" title="인용문 추가/숨기기">❝</button>
          <button class="card-star" title="중요 표시">☆</button>
          <button class="card-del" title="삭제">×</button>
        </div>
        <div class="card-meta">
          <input class="meta-source" list="sourceList" placeholder="출처 (책, 논문, 영상…)" maxlength="120">
          <input class="meta-page" placeholder="p" maxlength="20">
        </div>
        <div class="card-quote">
          <textarea class="quote-input" rows="1" placeholder="인용하고 싶은 문장"></textarea>
        </div>
        <div class="card-body">
          <div class="card-text" contenteditable="true" data-placeholder=""></div>
        </div>
        <div class="card-foot">
          <input class="date-input" type="date">
        </div>`;
      world.appendChild(el);
      wireCardEvents(el, card.id);
      if(connectMode) el.classList.add('connect-mode-active');
    }
    el.style.left = card.x+'px';
    el.style.top = card.y+'px';

    const dateInput = el.querySelector('.date-input');
    if(document.activeElement !== dateInput) dateInput.value = card.date || '';

    const srcIn = el.querySelector('.meta-source');
    const pageIn = el.querySelector('.meta-page');
    const quoteIn = el.querySelector('.quote-input');
    if(document.activeElement !== srcIn) srcIn.value = card.source || '';
    if(document.activeElement !== pageIn) pageIn.value = card.page || '';
    if(document.activeElement !== quoteIn) quoteIn.value = card.quote || '';
    if(quoteIn.value) el.classList.add('has-quote');
    autoGrow(quoteIn);

    const srcVal = (document.activeElement === srcIn) ? srcIn.value : (card.source || '');
    const hasSrc = !!normSource(srcVal);
    el.classList.toggle('has-source', hasSrc);
    el.querySelector('.src-band').style.background = hasSrc ? sourceColor(srcVal) : '';
    el.classList.toggle('important', !!card.important);
    el.querySelector('.card-star').textContent = card.important ? '★' : '☆';

    const textDiv = el.querySelector('.card-text');
    if(document.activeElement !== textDiv && textDiv.innerHTML !== (card.html||'')){
      textDiv.innerHTML = card.html || '';
    }
  }

  /* ---------- 라이트박스 ---------- */
  function openLightbox(url){
    document.getElementById('lbContent').innerHTML = `<img src="${url}">`;
    document.getElementById('lightbox').classList.add('show');
  }
  document.getElementById('lbClose').onclick = ()=> document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') e.currentTarget.classList.remove('show'); });

  function getRangeFromPoint(x,y){
    if(document.caretRangeFromPoint) return document.caretRangeFromPoint(x,y);
    if(document.caretPositionFromPoint){
      const p = document.caretPositionFromPoint(x,y); if(!p) return null;
      const r = document.createRange(); r.setStart(p.offsetNode, p.offset); r.collapse(true); return r;
    }
    return null;
  }

  function saveCardHtml(cardId, textDiv){
    const c = cards.get(cardId); if(!c) return;
    c.html = textDiv.innerHTML;
    updateDoc(doc(cardsCol, cardId), {html:c.html, updatedAt: serverTimestamp()}).catch(console.error);
  }

  /* ---------- 사진/영상을 커서 위치에 삽입 ---------- */
  async function insertMediaAtCaret(cardId, textDiv, file, forcedRange){
    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');
    if(!isVideo && !isImage) return;

    const id = uid();
    const path = `media/${cardId}/${id}-${file.name || (isVideo?'video':'image')}`;

    const wrapper = document.createElement('div');
    wrapper.className = 'embed uploading';
    wrapper.contentEditable = 'false';
    wrapper.dataset.path = path;
    wrapper.textContent = '업로드 중…';

    let range = forcedRange;
    if(!range){
      const sel = window.getSelection();
      if(sel && sel.rangeCount>0 && textDiv.contains(sel.anchorNode)) range = sel.getRangeAt(0);
    }
    if(range && textDiv.contains(range.startContainer)){
      range.deleteContents(); range.insertNode(wrapper);
      const br = document.createElement('br'); wrapper.after(br);
    } else {
      textDiv.appendChild(wrapper); textDiv.appendChild(document.createElement('br'));
    }

    try{
      const sref = ref(storage, path);
      await uploadBytes(sref, file);
      const url = await getDownloadURL(sref);
      wrapper.className = 'embed';
      wrapper.innerHTML = (isVideo ? `<video src="${url}" controls preload="metadata"></video>` : `<img src="${url}">`)
        + `<button class="embed-rm" title="삭제">×</button>`;
      saveCardHtml(cardId, textDiv);
    }catch(err){
      console.error(err);
      wrapper.remove();
      showAlert('업로드에 실패했어요. Storage 설정과 규칙을 확인해주세요.');
    }
    requestAnimationFrame(updateLines);
  }

  function wireCardEvents(el, cardId){
    const dateInput = el.querySelector('.date-input');
    const textDiv = el.querySelector('.card-text');
    const delBtn = el.querySelector('.card-del');
    const head = el.querySelector('.card-head');

    dateInput.addEventListener('change', ()=>{
      const c = cards.get(cardId); if(!c) return; c.date = dateInput.value;
      updateDoc(doc(cardsCol, cardId), {date:c.date, updatedAt: serverTimestamp()}).catch(console.error);
    });

    /* 출처 / 쪽수 / 인용 / 중요 표시 */
    const srcIn = el.querySelector('.meta-source');
    const pageIn = el.querySelector('.meta-page');
    const quoteIn = el.querySelector('.quote-input');
    const starBtn = el.querySelector('.card-star');
    const band = el.querySelector('.src-band');

    function bindField(input, key, onLocal){
      const flush = ()=>{
        clearTimeout(input._t);
        const c = cards.get(cardId); if(!c) return;
        c[key] = input.value;
        updateDoc(doc(cardsCol, cardId), {[key]: c[key], updatedAt: serverTimestamp()}).catch(console.error);
      };
      input.addEventListener('input', ()=>{
        const c = cards.get(cardId); if(c) c[key] = input.value;
        if(onLocal) onLocal();
        clearTimeout(input._t); input._t = setTimeout(flush, 400);
      });
      input.addEventListener('blur', flush);
    }
    bindField(srcIn, 'source', ()=>{
      const has = !!normSource(srcIn.value);
      el.classList.toggle('has-source', has);
      band.style.background = has ? sourceColor(srcIn.value) : '';
      refreshSourceList(); applyHighlights();
    });
    bindField(pageIn, 'page');
    bindField(quoteIn, 'quote', ()=>{ autoGrow(quoteIn); requestAnimationFrame(updateLines); });

    const quoteBtn = el.querySelector('.card-quote-btn');
    quoteBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(el.classList.contains('has-quote') && !quoteIn.value.trim()){
        el.classList.remove('has-quote');
      } else if(!el.classList.contains('has-quote')){
        el.classList.add('has-quote'); autoGrow(quoteIn); quoteIn.focus();
      } else { quoteIn.focus(); }
      requestAnimationFrame(updateLines);
    });
    quoteIn.addEventListener('blur', ()=>{
      if(!quoteIn.value.trim()){ el.classList.remove('has-quote'); requestAnimationFrame(updateLines); }
    });

    starBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const c = cards.get(cardId); if(!c) return;
      c.important = !c.important;
      el.classList.toggle('important', c.important);
      starBtn.textContent = c.important ? '★' : '☆';
      updateDoc(doc(cardsCol, cardId), {important:c.important, updatedAt: serverTimestamp()}).catch(console.error);
    });

    band.addEventListener('click', (e)=>{
      if(connectMode) return;
      e.stopPropagation();
      const c = cards.get(cardId); if(!c) return;
      const key = normSource(c.source);
      focusSource = (focusSource === key) ? null : key;
      applyHighlights();
      showToast(focusSource ? `"${c.source.trim()}" 카드만 강조 중 (Esc로 해제)` : '강조를 껐어요');
    });

    textDiv.addEventListener('input', ()=>{
      clearTimeout(textDiv._t);
      textDiv._t = setTimeout(()=> saveCardHtml(cardId, textDiv), 400);
      requestAnimationFrame(updateLines);
    });
    textDiv.addEventListener('blur', ()=>{ clearTimeout(textDiv._t); saveCardHtml(cardId, textDiv); });

    /* 삽입된 미디어의 × 버튼 / 이미지 확대 (이벤트 위임) */
    textDiv.addEventListener('click', async (e)=>{
      const rm = e.target.closest('.embed-rm');
      if(rm){
        e.stopPropagation();
        const embed = rm.closest('.embed');
        const ok = await showConfirm('이 사진/영상을 삭제할까요?');
        if(!ok) return;
        const path = embed.dataset.path;
        embed.remove();
        saveCardHtml(cardId, textDiv);
        if(path) deleteObject(ref(storage, path)).catch(()=>{});
        return;
      }
      const img = e.target.closest('.embed img');
      if(img) openLightbox(img.src);
    });

    textDiv.addEventListener('paste', async (e)=>{
      const items = Array.from(e.clipboardData?.items || []);
      const fileItem = items.find(it => it.kind==='file' && (it.type.startsWith('image/') || it.type.startsWith('video/')));
      if(!fileItem) return;
      e.preventDefault();
      const file = fileItem.getAsFile();
      const sel = window.getSelection();
      const range = (sel && sel.rangeCount>0) ? sel.getRangeAt(0) : null;
      await insertMediaAtCaret(cardId, textDiv, file, range);
    });

    textDiv.addEventListener('dragover', (e)=>{ e.preventDefault(); textDiv.classList.add('drag-over'); });
    textDiv.addEventListener('dragleave', ()=> textDiv.classList.remove('drag-over'));
    textDiv.addEventListener('drop', async (e)=>{
      e.preventDefault(); textDiv.classList.remove('drag-over');
      const file = Array.from(e.dataTransfer.files||[]).find(f=> f.type.startsWith('image/') || f.type.startsWith('video/'));
      if(!file) return;
      await insertMediaAtCaret(cardId, textDiv, file, getRangeFromPoint(e.clientX, e.clientY));
    });

    delBtn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok = await showConfirm('이 카드를 삭제할까요? 안에 있는 사진/영상도 함께 삭제돼요.');
      if(ok) deleteCard(cardId);
    });

    /* 카드 상단 더블클릭: 이 카드와 선으로 연결된 카드만 강조 (다시 더블클릭하면 해제) */
    head.addEventListener('dblclick', (e)=>{
      if(connectMode) return;
      if(e.target.closest('.date-input') || e.target.closest('.card-del') || e.target.closest('.card-star') || e.target.closest('.card-quote-btn')) return;
      e.stopPropagation();
      focusCard = (focusCard === cardId) ? null : cardId;
      applyHighlights();
      if(focusCard){
        const n = linkedSet().size - 1;
        showToast(n>0 ? `연결된 카드 ${n}개만 강조 중 (Esc로 해제)` : '이 카드는 연결된 카드가 없어요');
      } else showToast('강조를 껐어요');
    });

    /* 카드 드래그 이동 */
    head.addEventListener('mousedown', (e)=>{
      if(connectMode) return;
      if(e.target.closest('.date-input') || e.target.closest('.card-del') || e.target.closest('.card-star')) return;
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const c = cards.get(cardId); const ox = c.x, oy = c.y;
      el.classList.add('raised');   // 마지막으로 옮긴 카드를 맨 위로 (스타일은 style.css의 .card.raised)
      const drag = makeDragger(cardId, el);
      function onMove(ev){
        drag.to(ox + (ev.clientX - startX)/zoom, oy + (ev.clientY - startY)/zoom);
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
        drag.end();
      }
      document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    });
    head.addEventListener('touchstart', (e)=>{
      if(connectMode) return;
      if(e.target.closest('.date-input') || e.target.closest('.card-del') || e.target.closest('.card-star')) return;
      const t = e.touches[0]; const startX = t.clientX, startY = t.clientY;
      const c = cards.get(cardId); const ox = c.x, oy = c.y;
      const drag = makeDragger(cardId, el);
      function onMove(ev){
        const tt = ev.touches[0];
        drag.to(ox + (tt.clientX - startX)/zoom, oy + (tt.clientY - startY)/zoom);
        ev.preventDefault();
      }
      function onEnd(){
        document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd);
        drag.end();
      }
      document.addEventListener('touchmove', onMove, {passive:false}); document.addEventListener('touchend', onEnd);
    }, {passive:true});

    el.addEventListener('click', (e)=>{
      if(!connectMode) return;
      e.stopPropagation();
      handleConnectClick(cardId);
    });
  }

  /* ---------- 연결 ---------- */
  function handleConnectClick(cardId){
    if(!connectFrom){
      connectFrom = cardId;
      document.getElementById(cardId).classList.add('selected-endpoint');
      return;
    }
    if(connectFrom === cardId){ clearConnectSelection(); return; }
    let existing = null;
    for(const l of links.values()){
      if((l.from===connectFrom && l.to===cardId) || (l.from===cardId && l.to===connectFrom)){ existing = l; break; }
    }
    if(existing){
      deleteDoc(doc(linksCol, existing.id)).catch(console.error);
      showToast('연결을 끊었어요');
    } else {
      setDoc(doc(linksCol, uid()), {from: connectFrom, to: cardId}).catch(console.error);
      showToast('두 카드를 이었어요');
    }
    clearConnectSelection();
  }
  function clearConnectSelection(){
    if(connectFrom){
      const el = document.getElementById(connectFrom);
      if(el) el.classList.remove('selected-endpoint');
    }
    connectFrom = null;
  }

  function deleteCard(cardId){
    const c = cards.get(cardId);
    if(c) mediaPathsIn(c.html).forEach(p=> deleteObject(ref(storage, p)).catch(()=>{}));
    deleteDoc(doc(cardsCol, cardId)).catch(console.error);
    for(const l of links.values()){
      if(l.from===cardId || l.to===cardId) deleteDoc(doc(linksCol, l.id)).catch(console.error);
    }
  }

  /* ---------- 선 (카드 중앙 ↔ 중앙, 점선, 흐릿하게) ---------- */
  const tagEls = new Map(); // "linkId:tagId" -> 태그 카드 element

  // 곡선 위의 점 (t: 0~1)
  const bez = (t, p0, c, p2)=> (1-t)*(1-t)*p0 + 2*(1-t)*t*c + t*t*p2;

  function updateLines(){
    svg.innerHTML = '';
    const vpRect = viewport.getBoundingClientRect();
    const liveTags = new Set();
    links.forEach(l=>{
      const a = document.getElementById(l.from), b = document.getElementById(l.to);
      if(!a || !b) return;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.left + ra.width/2 - vpRect.left, y1 = ra.top + ra.height/2 - vpRect.top;
      const x2 = rb.left + rb.width/2 - vpRect.left, y2 = rb.top + rb.height/2 - vpRect.top;
      const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
      const dist = Math.hypot(dx,dy)||1, nx=-dy/dist, ny=dx/dist, bow=Math.min(40, dist*0.18);
      const cx = mx+nx*bow, cy = my+ny*bow;
      const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
      const mine = !focusCard || l.from===focusCard || l.to===focusCard;
      const state = !focusCard ? '' : (mine ? ' is-active' : ' is-dim');   // 연결 보기 상태 (모양은 style.css에서)

      // 선을 더블클릭: 누른 자리에 접점 태그 만들기 (한 선에 여러 개 가능)
      const onDbl = (e)=>{
        e.stopPropagation();
        if(!(connectMode || (focusCard && mine))) return;   // 연결 모드이거나, 연결 보기 중인 선일 때만
        const sx = e.clientX - vpRect.left, sy = e.clientY - vpRect.top;
        let bestT = 0.5, bestD = Infinity;
        for(let i=1; i<50; i++){
          const t = i/50;
          const dd = Math.hypot(bez(t,x1,cx,x2)-sx, bez(t,y1,cy,y2)-sy);
          if(dd < bestD){ bestD = dd; bestT = t; }
        }
        createTag(l.id, bestT);
      };

      // 두껍고 투명한 클릭 영역 (얇은 선을 쉽게 누를 수 있게)
      const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('d', d); hit.setAttribute('class','link-hit');
      hit.addEventListener('dblclick', onDbl);
      svg.appendChild(hit);

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('class','link'+state);
      path.addEventListener('dblclick', onDbl);
      svg.appendChild(path);

      [[x1,y1],[x2,y2]].forEach(([px,py])=>{
        const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx',px); dot.setAttribute('cy',py); dot.setAttribute('r','3');   // r = 끝 점 크기
        dot.setAttribute('class','link-dot'+state);
        svg.appendChild(dot);
      });

      /* 선 위의 핑크 접점 태그들 */
      (l.tags||[]).forEach(tg=>{
        const key = l.id+':'+tg.id;
        liveTags.add(key);
        let el = tagEls.get(key);
        if(!el) el = makeTagEl(l.id, tg.id);
        const px = bez(tg.t, x1, cx, x2), py = bez(tg.t, y1, cy, y2);
        const pin = document.createElementNS('http://www.w3.org/2000/svg','circle');   // 태그가 붙는 자리의 점
        pin.setAttribute('cx', px); pin.setAttribute('cy', py); pin.setAttribute('r', '5');   // r = 태그 동그라미 크기
        pin.setAttribute('class', 'tag-pin' + (mine ? '' : ' is-dim'));
        svg.appendChild(pin);
        el.style.left = ((px - panX)/zoom)+'px';
        el.style.top = ((py - panY)/zoom - 12)+'px';   // 점 바로 위에 카드가 놓이게 12px 띄움
        el.classList.toggle('is-dim', !mine);
        const ta = el.querySelector('textarea');
        if(document.activeElement !== ta && ta.value !== (tg.note||'')) ta.value = tg.note || '';
      });
    });
    tagEls.forEach((el, key)=>{ if(!liveTags.has(key)){ el.remove(); tagEls.delete(key); } });
  }

  const findTag = (linkId, tagId)=> (links.get(linkId)?.tags || []).find(t=> t.id===tagId);
  function persistTags(linkId){
    const l = links.get(linkId); if(!l) return;
    // tag/note는 예전(태그 1개) 방식의 값이라 비워서 다시 읽히지 않게 함
    updateDoc(doc(linksCol, linkId), {tags: l.tags, tag:false, note:''}).catch(console.error);
  }

  function makeTagEl(linkId, tagId){
    const t = document.createElement('div');
    t.className = 'tag-card';
    t.innerHTML = `<button class="tag-del" title="태그 삭제">×</button><textarea rows="1" placeholder="" maxlength="500"></textarea>`;
    tagWorld.appendChild(t);
    tagEls.set(linkId+':'+tagId, t);
    const ta = t.querySelector('textarea');
    const grow = ()=>{ ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, 20)+'px'; };
    const flush = ()=>{ clearTimeout(ta._t); persistTags(linkId); };
    ta.addEventListener('input', ()=>{
      const tg = findTag(linkId, tagId); if(tg) tg.note = ta.value;
      grow(); clearTimeout(ta._t); ta._t = setTimeout(flush, 400);
    });
    ta.addEventListener('blur', flush);
    t.querySelector('.tag-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok = await showConfirm('이 태그 카드를 삭제할까요? (연결선은 그대로 남아요)');
      if(!ok) return;
      const l = links.get(linkId); if(!l) return;
      l.tags = (l.tags||[]).filter(x=> x.id!==tagId);
      persistTags(linkId);
      updateLines();
    });
    requestAnimationFrame(grow);
    return t;
  }

  function createTag(linkId, tPos){
    const l = links.get(linkId); if(!l) return;
    l.tags = l.tags || [];
    // 이미 가까이에 태그가 있으면 새로 만들지 않고 그 태그를 편집
    let tg = l.tags.find(x=> Math.abs(x.t - tPos) < 0.04);
    if(!tg){
      tg = {id: uid(), t: tPos, note: ''};
      l.tags.push(tg);
      persistTags(linkId);
    }
    updateLines();
    const el = tagEls.get(linkId+':'+tg.id);
    if(el) el.querySelector('textarea').focus();
  }

  /* ---------- 부드럽게 따라오는 움직임 (ease-out) ---------- */
  const EASE = 0.14;   // 작을수록 더 느긋하게 따라와요 (0.08 ~ 0.25 사이로 조절)
  const easeK = (dt)=> 1 - Math.pow(1-EASE, Math.min(50, dt)/16.67);

  // 화면(캔버스) 드래그
  let panTX = 0, panTY = 0, glideRaf = 0, glideLast = 0;
  function cancelGlide(){ if(glideRaf){ cancelAnimationFrame(glideRaf); glideRaf = 0; } }
  function glideTo(tx, ty){
    panTX = tx; panTY = ty;
    if(!glideRaf){ glideLast = performance.now(); glideRaf = requestAnimationFrame(glideStep); }
  }
  function glideStep(now){
    const k = easeK(now - glideLast); glideLast = now;
    panX += (panTX - panX)*k; panY += (panTY - panY)*k;
    if(Math.abs(panTX-panX) < 0.3 && Math.abs(panTY-panY) < 0.3){
      panX = panTX; panY = panTY; applyTransform(); glideRaf = 0; saveLocalView(); return;
    }
    applyTransform();
    glideRaf = requestAnimationFrame(glideStep);
  }

  // 카드 드래그: 손을 떼도 목표 위치까지 스르륵 따라간 뒤 저장
  function makeDragger(cardId, el){
    const c = cards.get(cardId);
    let tx = c.x, ty = c.y, raf = 0, last = 0, down = true;
    const apply = ()=>{ el.style.left = c.x+'px'; el.style.top = c.y+'px'; updateLines(); };
    const finish = ()=>{
      resolveOverlap(cardId);
      updateDoc(doc(cardsCol, cardId), {x:c.x, y:c.y, updatedAt: serverTimestamp()}).catch(console.error);
    };
    function step(now){
      const k = easeK(now - last); last = now;
      c.x += (tx - c.x)*k; c.y += (ty - c.y)*k;
      if(Math.abs(tx-c.x) < 0.3 && Math.abs(ty-c.y) < 0.3){
        c.x = tx; c.y = ty; apply(); raf = 0;
        if(!down) finish();
        return;
      }
      apply(); raf = requestAnimationFrame(step);
    }
    return {
      to(x, y){ tx = x; ty = y; if(!raf){ last = performance.now(); raf = requestAnimationFrame(step); } },
      end(){ down = false; if(!raf) finish(); }
    };
  }

  /* ---------- 이동 / 확대축소 ---------- */
  let isPanning=false, panStartX=0, panStartY=0, panOrigX=0, panOrigY=0;
  viewport.addEventListener('mousedown', (e)=>{
    if(e.target.closest('.card') || e.target.closest('.tag-card') || e.target.closest('#lines')) return;
    if(connectMode){ clearConnectSelection(); return; }
    cancelGlide();
    window.getSelection()?.removeAllRanges();   // 배경 드래그 시 카드 글자가 파랗게 선택되는 것 방지
    isPanning = true; viewport.classList.add('panning');
    panStartX = e.clientX; panStartY = e.clientY; panOrigX = panX; panOrigY = panY;
  });
  window.addEventListener('mousemove', (e)=>{
    if(!isPanning) return;
    glideTo(panOrigX + (e.clientX - panStartX), panOrigY + (e.clientY - panStartY));
  });
  window.addEventListener('mouseup', ()=>{
    if(isPanning){ isPanning=false; viewport.classList.remove('panning'); }
  });

  let touchState = null;
  viewport.addEventListener('touchstart', (e)=>{
    if(e.target.closest('.card') || e.target.closest('.tag-card')) return;
    cancelGlide();
    if(e.touches.length===1){ touchState = {mode:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY, ox:panX, oy:panY}; }
    else if(e.touches.length===2){
      const [t1,t2]=e.touches;
      touchState = {mode:'pinch', d:Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY), oz:zoom, ox:panX, oy:panY,
        cx:(t1.clientX+t2.clientX)/2, cy:(t1.clientY+t2.clientY)/2};
    }
  }, {passive:true});
  viewport.addEventListener('touchmove', (e)=>{
    if(!touchState) return;
    if(touchState.mode==='pan' && e.touches.length===1){
      glideTo(touchState.ox + (e.touches[0].clientX - touchState.x), touchState.oy + (e.touches[0].clientY - touchState.y));
    } else if(touchState.mode==='pinch' && e.touches.length===2){
      const [t1,t2]=e.touches;
      const d = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
      const newZoom = Math.min(2.5, Math.max(0.25, touchState.oz*(d/touchState.d)));
      const wx=(touchState.cx-touchState.ox)/touchState.oz, wy=(touchState.cy-touchState.oy)/touchState.oz;
      panX = touchState.cx - wx*newZoom; panY = touchState.cy - wy*newZoom; zoom = newZoom;
      applyTransform();
    }
  }, {passive:true});
  viewport.addEventListener('touchend', ()=>{ touchState=null; if(!glideRaf) saveLocalView(); });

  let wheelSaveTimer;
  viewport.addEventListener('wheel', (e)=>{
    e.preventDefault(); cancelGlide();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const worldX = (mx-panX)/zoom, worldY = (my-panY)/zoom;
    const newZoom = Math.min(2.5, Math.max(0.25, zoom*(1 + -e.deltaY*0.0016)));
    panX = mx-worldX*newZoom; panY = my-worldY*newZoom; zoom = newZoom;
    applyTransform();
    clearTimeout(wheelSaveTimer); wheelSaveTimer = setTimeout(saveLocalView, 300);
  }, {passive:false});

  function zoomAtCenter(factor){
    cancelGlide();
    const rect = viewport.getBoundingClientRect();
    const mx = rect.width/2, my = rect.height/2;
    const worldX = (mx-panX)/zoom, worldY = (my-panY)/zoom;
    zoom = Math.min(2.5, Math.max(0.25, zoom*factor));
    panX = mx-worldX*zoom; panY = my-worldY*zoom;
    applyTransform(); saveLocalView();
  }
  /* ---------- 카드끼리 겹치지 않게: 겹치면 가장 가까운 빈자리로 틩~ 밀어냄 ---------- */
  const OVERLAP_GAP = 16; // 카드 사이 최소 간격(px)
  function rectOf(c){
    const e = document.getElementById(c.id);
    return {x:c.x, y:c.y, w:e?e.offsetWidth:260, h:e?e.offsetHeight:200};
  }
  function rectsHit(a, b){
    return a.x < b.x+b.w+OVERLAP_GAP && a.x+a.w+OVERLAP_GAP > b.x &&
           a.y < b.y+b.h+OVERLAP_GAP && a.y+a.h+OVERLAP_GAP > b.y;
  }
  function resolveOverlap(cardId){
    const c = cards.get(cardId); if(!c) return false;
    const me = rectOf(c);
    const others = [];
    cards.forEach(o=>{ if(o.id!==cardId) others.push(rectOf(o)); });
    const isFree = (x,y)=> !others.some(o=> rectsHit({x,y,w:me.w,h:me.h}, o));
    if(isFree(me.x, me.y)) return false;

    // 근처 카드들만 후보 계산에 사용
    const near = others.filter(o=> rectsHit({x:me.x-600, y:me.y-600, w:me.w+1200, h:me.h+1200}, o));
    const xs = [me.x], ys = [me.y];
    near.forEach(o=>{
      xs.push(o.x+o.w+OVERLAP_GAP, o.x-me.w-OVERLAP_GAP);
      ys.push(o.y+o.h+OVERLAP_GAP, o.y-me.h-OVERLAP_GAP);
    });
    let best = null, bestD = Infinity;
    for(const x of xs) for(const y of ys){
      const d = Math.hypot(x-me.x, y-me.y);
      if(d < bestD && isFree(x,y)){ best = {x,y}; bestD = d; }
    }
    if(!best) return false;

    const el = document.getElementById(cardId);
    c.x = best.x; c.y = best.y;
    if(el){
      el.classList.add('settling');
      el.style.left = c.x+'px'; el.style.top = c.y+'px';
      setTimeout(()=> el.classList.remove('settling'), 350);
    }
    const t0 = performance.now();
    (function tick(){ updateLines(); if(performance.now()-t0 < 380) requestAnimationFrame(tick); })();
    return true;
  }

  /* ---------- 카드 추가 ---------- */
  function addCardAt(worldX, worldY){
    const id = uid();
    const c = {id, x: worldX-130, y: worldY-40, date: new Date().toISOString().slice(0,10), html:'', source:'', page:'', quote:'', important:false};
    cards.set(id, c);
    renderCard(c);
    resolveOverlap(id);
    setDoc(doc(cardsCol, id), {x:c.x, y:c.y, date:c.date, html:'', source:'', page:'', quote:'', important:false, createdAt: serverTimestamp(), updatedAt: serverTimestamp()}).catch(console.error);
    document.getElementById(id).querySelector('.card-text').focus();
    return c;
  }
  viewport.addEventListener('dblclick', (e)=>{
    if(e.target.closest('.card') || e.target.closest('.tag-card') || e.target.closest('#lines') || connectMode) return;
    if(focusCard){ showToast('연결 보기 중이에요. Esc를 눌러 끄면 새 카드를 만들 수 있어요'); return; }
    const rect = viewport.getBoundingClientRect();
    addCardAt((e.clientX - rect.left - panX)/zoom, (e.clientY - rect.top - panY)/zoom);
  });

  document.getElementById('btnConnect').onclick = (e)=>{
    connectMode = !connectMode;
    e.currentTarget.classList.toggle('active', connectMode);
    viewport.classList.toggle('connect-mode', connectMode);
    document.querySelectorAll('.card').forEach(el=> el.classList.toggle('connect-mode-active', connectMode));
    clearConnectSelection();
    showToast(connectMode ? '카드 두 개를 눌러 연결해보세요' : '연결 모드를 껐어요');
  };

  /* ---------- 검색 ---------- */
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(el=>{
      const c = cards.get(el.id); if(!c) return;
      if(!q){ el.classList.remove('dimmed'); return; }
      const hay = [plainText(c.html), c.source, c.page, c.quote, c.date].join(' ').toLowerCase();
      const hit = hay.includes(q);
      el.classList.toggle('dimmed', !hit);
    });
  });

  window.addEventListener('resize', updateLines);
  window.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && (focusSource || focusCard)){ focusSource=null; focusCard=null; applyHighlights(); showToast('강조를 껐어요'); } });

  /* ---------- 실시간 동기화 ---------- */
  window.__journalReady = function(){
    loadLocalView();
    applyTransform();

    onSnapshot(cardsCol, (snap)=>{
      snap.docChanges().forEach(ch=>{
        const id = ch.doc.id;
        if(ch.type==='removed'){
          cards.delete(id);
          const el = document.getElementById(id); if(el) el.remove();
        } else {
          const d = ch.doc.data();
          const c = {id, x:d.x||0, y:d.y||0, date:d.date||'', html:d.html||'', source:d.source||'', page:d.page||'', quote:d.quote||'', important:!!d.important};
          cards.set(id, c); renderCard(c);
        }
      });
      refreshSourceList(); applyHighlights();
      updateLines();
      if(!ready && !snap.metadata.fromCache){
        ready = true;
        if(cards.size===0){
          const rect = viewport.getBoundingClientRect();
          addCardAt((rect.width/2 - panX)/zoom, (rect.height/2 - panY)/zoom);
        }
      }
    }, (err)=>{ console.error(err); setSyncStatus('off'); });

    onSnapshot(linksCol, (snap)=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed') links.delete(ch.doc.id);
        else {
          const d = ch.doc.data();
          // tags: [{id,t,note}] (t = 선 위 위치 0~1). 예전 방식(tag/note)은 가운데 태그 1개로 변환
          const tags = Array.isArray(d.tags) ? d.tags.map(x=>({id:x.id, t:x.t, note:x.note||''}))
                     : (d.tag ? [{id:'t0', t:0.5, note:d.note||''}] : []);
          links.set(ch.doc.id, {id:ch.doc.id, from:d.from, to:d.to, tags});
        }
      });
      applyHighlights();
    });
  };

  /* ---------- 구글 로그인 ---------- */
  const loginScreen = document.getElementById('loginScreen');
  const loginMsg = document.getElementById('loginMsg');
  let started = false;

  onAuthStateChanged(auth, async (user)=>{
    if(user && user.isAnonymous){ await signOut(auth); return; } // 예전 익명 세션 정리
    if(user){
      loginScreen.style.display = 'none';
      setSyncStatus('ok');
      if(!started){ started = true; window.__journalReady(); }
    } else {
      loginScreen.style.display = 'flex';
      setSyncStatus('off');
      syncText.textContent = '로그인 필요';
    }
  });

  document.getElementById('btnGoogle').onclick = async ()=>{
    loginMsg.textContent = '';
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(err){ console.error(err); loginMsg.textContent = '로그인 실패: ' + (err.code || err.message); }
  };
  document.getElementById('btnLogout').onclick = async ()=>{
    const ok = await showConfirm('로그아웃할까요?', {okText:'로그아웃', okClass:'confirm-ok neutral'});
    if(ok){ await signOut(auth); location.reload(); }
  };

  })();
</script>
</body>
